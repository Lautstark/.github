name: Release

# The release train for the shared packages, written once.
#
# A package calls this on every push to main. It installs, runs the package's
# own gate, and then lets semantic-release decide whether the commits since
# the last tag add up to a release. If they do, semantic-release bumps
# package.json, writes the CHANGELOG, commits both, tags, and writes the
# GitHub release. If they do not - docs, ci, chore, refactor - nothing happens
# and the run is green.
#
# There is no registry. A git tag is the release, the way it always was in
# this family: consumers pin `github:Lautstark/<pkg>#vX.Y.Z`, npm fetches the
# tag and runs the package's `prepare` on their machine, and Renovate moves the
# pin when a new tag appears. What changed on 2026-09-16 is only who cuts the
# tag: nobody bumps a version by hand any more. The version is a function of
# the commit subjects: feat is a minor, fix and perf a patch, feat! or a
# BREAKING CHANGE trailer a major. That is the same rule commit-messages.yml
# already holds every commit to, which is why the two live in the same
# repository.
#
# (For one afternoon this workflow also published to npmjs.org. The family
# decided against a registry the same day - the code is public already, and a
# shop window was not wanted - so the npm half went and nothing was ever
# published.)
#
# What the caller provides:
#
#   gate   the command that has to pass before anything is tagged -
#          typically "npm run typecheck && npm test && npm run build".

on:
  workflow_call:
    inputs:
      gate:
        description: The command that must pass before a release is cut.
        type: string
        required: true
      node-version:
        type: string
        default: '22'

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    # One release at a time per repository. Two runs racing to bump the same
    # package.json would both be right and one of them would lose.
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      # The release commit and the tag.
      contents: write
      # semantic-release opens an issue when a release fails, and closes it
      # when the next one succeeds.
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          # semantic-release walks the history back to the last tag.
          fetch-depth: 0
          # Nothing here pushes with the checkout's credentials; @semantic-release/git
          # pushes with GH_TOKEN below, which is the one whose permissions are
          # declared on this job.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - run: npm ci

      - name: The gate
        run: ${{ inputs.gate }}

      - name: semantic-release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: npx semantic-release

      # The check the tag-triggered CI used to make, adapted: there is no
      # hand-written tag any more, so the question is asked of the commit
      # semantic-release just made. The tag on HEAD and package.json have to
      # be the same number. If HEAD carries no tag, nothing was released this
      # run, and that is a valid answer.
      - name: Tag and package.json agree
        run: |
          tag=$(git describe --tags --exact-match HEAD 2>/dev/null || true)
          if [ -z "$tag" ]; then
            echo "No tag on HEAD: nothing was released this run."
            exit 0
          fi
          pkg="v$(npm pkg get version | tr -d '"')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $tag but package.json says $pkg"
            exit 1
          fi
          echo "$tag: the tag and package.json agree."
